name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve dependencies
        run: xcodebuild -project Tea.xcodeproj -scheme Tea -resolvePackageDependencies

      - name: Build
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          xcodebuild -project Tea.xcodeproj \
            -scheme Tea \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Package
        run: |
          cd build/Build/Products/Release
          zip -r Tea.zip Tea.app
          mv Tea.zip "$GITHUB_WORKSPACE/"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          {
            echo 'CHANGELOG<<EOF'
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:'- %s' "${PREV_TAG}..${GITHUB_REF_NAME}"
            else
              git log --pretty=format:'- %s' "${GITHUB_REF_NAME}"
            fi
            echo
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Tea.zip
          body: ${{ steps.changelog.outputs.CHANGELOG }}
